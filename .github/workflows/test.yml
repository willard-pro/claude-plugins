name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck socat jq python3-pytest
          SHFMT_VER=3.10.0
          curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Lint (ShellCheck)
        run: make lint

      - name: Format check (shfmt)
        run: make fmt-check

      - name: Generated-section drift check
        run: make check-generated

      - name: Unit tests
        run: make test

      # Deliberately AFTER the main run, and only here. The suite above runs
      # with no opentelemetry installed, which is what keeps "fleetd works
      # without its one optional dependency" continuously verified rather than
      # assumed. This step then installs it and re-runs the exporter tests, so
      # the real SDK path is covered too and an upstream API change is caught.
      - name: OTel exporter against the real SDK
        run: |
          python3 -m pip install --quiet -r fleet-controller/fleetd/requirements-otel.txt
          python3 -m pytest fleet-controller/fleetd/tests/test_otel.py -v
